<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImagingStudy-open event flow</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      font-family: Arial, Helvetica, sans-serif;
      background: #f8fafc;
      color: #06146b;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
    }
    p {
      margin: 0;
      max-width: 52rem;
      text-align: center;
      color: #334155;
      line-height: 1.5;
    }
    .diagram {
      width: min(1200px, 100%);
      line-height: 0;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(11, 27, 95, 0.08);
      overflow: hidden;
    }
    object {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
    }
    a { color: #2457d6; }
  </style>
</head>
<body>
  <h1>ImagingStudy-open event flow</h1>
  <p>
    Click the diagram to play each step: worklist selection, HTTPS publish,
    hub WebSocket fan-out, and synchronized app updates.
    <a href="https://github.com/mbellehumeur/SlicerCastInterface">SlicerCastInterface</a>
  </p>
  <div class="diagram">
    <object
      data="images/imagingstudy-open-flow-interactive.svg"
      type="image/svg+xml"
      width="1200"
      height="700"
      aria-label="Interactive ImagingStudy-open event flow diagram">
      <p>
        Your browser cannot display this interactive SVG.
        <a href="images/imagingstudy-open-flow-interactive.svg">Open the SVG directly</a>.
      </p>
    </object>
  </div>
</body>
</html>
